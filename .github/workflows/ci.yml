name: CI

on:
  push:
    branches: [main, develop, feature/agents-layout-experiment]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks (macOS, Python 3.11)
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      UV_PYTHON_DOWNLOADS: never
      UV_NO_CACHE: "true"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Check agent instructions
        run: |
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          guides = subprocess.check_output(
              ["git", "ls-files", "AGENTS.md", "*/AGENTS.md"], text=True
          ).splitlines()
          if guides != ["AGENTS.md"]:
              raise SystemExit(f"Expected one root AGENTS.md, found {guides}")

          current = Path("AGENTS.md").read_text(encoding="utf-8")
          for heading in ("## 작업 순서", "## 토큰 사용량 관리", "## src/ 구현 규칙", "## docs/ 기록 규칙"):
              if heading not in current:
                  raise SystemExit(f"Missing instruction section {heading}")

          previous = subprocess.check_output(
              ["git", "show", "HEAD^:AGENTS.md"], encoding="utf-8"
          )
          before = len(previous.encode("utf-8"))
          after = len(current.encode("utf-8"))
          reduction = (before - after) / before * 100 if before else 0
          result = f"AGENTS.md UTF-8 bytes {before} → {after} ({reduction:.2f}% reduction)"
          print(result)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(result + "\n")
          PY
      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.13.7"
          enable-cache: false
      - name: Create project environment
        run: uv venv --no-python-downloads .venv
      - name: Sync requirements
        run: uv pip sync --python .venv --allow-empty-requirements requirements.txt
      - name: Run unittest checks
        run: uv run --python .venv python -B -X utf8 -m unittest discover -s tests -v
